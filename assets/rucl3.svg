.t{fill:#e8e6f5;} .m{fill:#8d8aae;} .p{fill:#fe428e;} .c{fill:#a9fef7;} .y{fill:#f8d847;}
.title{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:17px;fill:#fe428e;}
.sub{font-size:12px;fill:#8d8aae;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;}}

.cl,.qu{stroke-dasharray:700;stroke-dashoffset:700;animation:drawc 8.0s ease-in-out infinite;}
.qu{animation-delay:.4s;}
@keyframes drawc{0%{stroke-dashoffset:700;}40%{stroke-dashoffset:0;}90%{stroke-dashoffset:0;opacity:1;}100%{stroke-dashoffset:0;opacity:0;}}
.star{opacity:0;animation:star 8.0s ease-out infinite;transform-box:fill-box;transform-origin:center;}
