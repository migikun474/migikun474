<svg xmlns="http://www.w3.org/2000/svg" width="900" height="318" viewBox="0 0 900 318" role="img" aria-label="Schematic animation of the quantum-classical crossover point N* for simulating the neutron spectrum of alpha-RuCl3">
<title>Schematic animation of the quantum-classical crossover point N* for simulating the neutron spectrum of alpha-RuCl3</title>
<style>
