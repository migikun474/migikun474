<line x1="452" y1="80" x2="452" y2="280" stroke="#2e2b4a"/>
<text x="480" y="84" font-size="11" class="m" letter-spacing="1.5">BINANCE BTCUSDT PRICE COLUMN · 3.56M ROWS</text>

<text x="480" y="110" font-size="12" class="t">reference parser</text>
