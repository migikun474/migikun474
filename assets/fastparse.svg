<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-label="fastparse animation: SWAR digit combining and AVX2 throughput up to 5,311 MB/s against a 973 MB/s reference">
<title>fastparse animation: SWAR digit combining and AVX2 throughput up to 5,311 MB/s against a 973 MB/s reference</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
.t{fill:#e8e6f5;} .m{fill:#8d8aae;} .p{fill:#fe428e;} .c{fill:#a9fef7;} .y{fill:#f8d847;}
.title{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:17px;fill:#fe428e;}
.sub{font-size:12px;fill:#8d8aae;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;}}

.cell{opacity:0;animation:pop 9.0s ease-out infinite;}
@keyframes pop{0%{opacity:0;transform:translateY(-10px);}6%{opacity:1;transform:translateY(0);}88%{opacity:1;}96%,100%{opacity:0;}}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 9.0s cubic-bezier(.2,.8,.2,1) infinite;}
@keyframes grow{0%{transform:scaleX(0);}22%{transform:scaleX(1);}88%{transform:scaleX(1);}96%,100%{transform:scaleX(0);}}
.val{opacity:0;animation:fade 9.0s linear infinite;}
@keyframes fade{0%{opacity:0;}6%{opacity:1;}70%{opacity:1;}78%,100%{opacity:0;}}
.x{animation:pulse2 2s ease-in-out infinite;}
@keyframes pulse2{50%{opacity:.45;}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2e2b4a" stroke-width="0.6" opacity="0.55"/></pattern>
</defs>
<rect width="900" height="310" rx="16" fill="#141321"/>
<rect x="0.5" y="0.5" width="899" height="309" rx="16" fill="none" stroke="#2e2b4a"/>

<text x="30" y="38" class="title">fastparse</text>
<text x="30" y="60" class="sub">market-data text → fixed-point integers · naive loop → SWAR → x86-64 asm → SSE → AVX2</text>
<text x="30" y="84" font-size="11" class="m" letter-spacing="1.5">SWAR: 8 DIGITS IN 3 MULTIPLY-ADDS, NOT 8 LOOP STEPS</text>
