<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="fasttime animation: rdtsc and vDSO clock reads at 16-20 ns against hpet and acpi_pm reads that trap into the kernel">
<title>fasttime animation: rdtsc and vDSO clock reads at 16-20 ns against hpet and acpi_pm reads that trap into the kernel</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
.t{fill:#e8e6f5;} .m{fill:#8d8aae;} .p{fill:#fe428e;} .c{fill:#a9fef7;} .y{fill:#f8d847;}
.title{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:17px;fill:#fe428e;}
.sub{font-size:12px;fill:#8d8aae;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2e2b4a" stroke-width="0.6" opacity="0.55"/></pattern>
</defs>
<rect width="900" height="300" rx="16" fill="#141321"/>
<rect x="0.5" y="0.5" width="899" height="299" rx="16" fill="none" stroke="#2e2b4a"/>

<text x="30" y="38" class="title">fasttime</text>
<text x="30" y="60" class="sub">is your Linux clock read secretly a system call? · p50 cost per read, bare-metal laptop</text>
<text x="300" y="88" font-size="10.5" class="m" letter-spacing="1.5">EACH DOT IS ONE CLOCK READ</text>
<text x="30" y="120" font-size="12.5" class="t">ft_now_ns() · rdtsc</text><line x1="300" y1="116" x2="820" y2="116" stroke="#2e2b4a" stroke-width="2" stroke-linecap="round"/><text x="832" y="120" font-size="12.5" font-weight="700" fill="#fe428e">16 ns</text><circle cy="116" r="4.5" fill="#fe428e" filter="url(#glow)"><animate attributeName="cx" values="300;820" dur="1.20s" begin="0.00s" repeatCount="indefinite"/></circle><circle cy="116" r="4.5" fill="#fe428e" filter="url(#glow)"><animate attributeName="cx" values="300;820" dur="1.20s" begin="0.40s" repeatCount="indefinite"/></circle><circle cy="116" r="4.5" fill="#fe428e" filter="url(#glow)"><animate attributeName="cx" values="300;820" dur="1.20s" begin="0.80s" repeatCount="indefinite"/></circle><text x="30" y="162" font-size="12.5" class="t">clock_gettime · tsc (vDSO)</text><line x1="300" y1="158" x2="820" y2="158" stroke="#2e2b4a" stroke-width="2" stroke-linecap="round"/><text x="832" y="162" font-size="12.5" font-weight="700" fill="#a9fef7">20 ns</text><circle cy="158" r="4.5" fill="#a9fef7" filter="url(#glow)"><animate attributeName="cx" values="300;820" dur="1.50s" begin="0.00s" repeatCount="indefinite"/></circle><circle cy="158" r="4.5" fill="#a9fef7" filter="url(#glow)"><animate attributeName="cx" values="300;820" dur="1.50s" begin="0.50s" repeatCount="indefinite"/></circle><circle cy="158" r="4.5" fill="#a9fef7" filter="url(#glow)"><animate attributeName="cx" values="300;820" dur="1.50s" begin="1.00s" repeatCount="indefinite"/></circle><text x="30" y="204" font-size="12.5" class="t">clock_gettime · hpet</text><line x1="300" y1="200" x2="820" y2="200" stroke="#2e2b4a" stroke-width="2" stroke-linecap="round"/><text x="832" y="204" font-size="12.5" font-weight="700" fill="#f8d847">1,213 ns</text><g><rect x="526" y="189" width="68" height="22" rx="6" fill="#2b1420" stroke="#ff6b6b" stroke-width="1">
  <animate attributeName="stroke-opacity" values="1;.35;1" dur="1s" repeatCount="indefinite"/></rect>
  <text x="560" y="185" text-anchor="middle" font-size="10" fill="#ff6b6b">syscall → kernel</text></g><circle cy="200" r="4.5" fill="#f8d847" filter="url(#glow)">
  <animate attributeName="cx" values="300;560;560;820" keyTimes="0;0.115;0.885;1" dur="5.20s" repeatCount="indefinite"/></circle><text x="30" y="246" font-size="12.5" class="t">clock_gettime · acpi_pm</text><line x1="300" y1="242" x2="820" y2="242" stroke="#2e2b4a" stroke-width="2" stroke-linecap="round"/><text x="832" y="246" font-size="12.5" font-weight="700" fill="#ff6b6b">1,966 ns</text><g><rect x="526" y="231" width="68" height="22" rx="6" fill="#2b1420" stroke="#ff6b6b" stroke-width="1">
  <animate attributeName="stroke-opacity" values="1;.35;1" dur="1s" repeatCount="indefinite"/></rect>
  <text x="560" y="227" text-anchor="middle" font-size="10" fill="#ff6b6b">syscall → kernel</text></g><circle cy="242" r="4.5" fill="#ff6b6b" filter="url(#glow)">
  <animate attributeName="cx" values="300;560;560;820" keyTimes="0;0.078;0.922;1" dur="7.70s" repeatCount="indefinite"/></circle>
<text x="30" y="278" font-size="11" class="m">fast lanes run at true relative speed; the kernel waits are compressed ~18× so the dots still move</text>

</svg>